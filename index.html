<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212529">
  <title>Moje kalkulačka</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <!-- Bootstrap přes CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <div class="calculator card shadow-sm mx-auto">
      <div class="card-body p-4">
        <h1 class="h3 text-center mb-4">Moje kalkulačka</h1>

        <div class="mb-3">
          <label for="numberA" class="form-label">První číslo</label>
          <input id="numberA" type="number" step="any" class="form-control form-control-lg" placeholder="Např. 10">
        </div>

        <div class="mb-3">
          <label for="numberB" class="form-label">Druhé číslo</label>
          <input id="numberB" type="number" step="any" class="form-control form-control-lg" placeholder="Např. 5">
        </div>

        <div class="d-grid gap-2 d-md-flex mb-4">
          <button class="btn btn-primary flex-fill operation" data-operation="+">+</button>
          <button class="btn btn-primary flex-fill operation" data-operation="-">−</button>
          <button class="btn btn-primary flex-fill operation" data-operation="*">×</button>
          <button class="btn btn-primary flex-fill operation" data-operation="/">÷</button>
        </div>

        <div class="alert alert-secondary text-center">
          Výsledek:
          <strong id="result">—</strong>
        </div>

        <hr>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 mb-0">Historie</h2>
          <button id="clearHistory" class="btn btn-sm btn-outline-danger">Smazat</button>
        </div>

        <ul id="history" class="list-group"></ul>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
